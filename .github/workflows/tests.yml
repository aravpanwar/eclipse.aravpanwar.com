name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # The tests use the standard library only, so pytest is all they need.
      - run: python -m pip install pytest==9.2.0
      - run: python -m pytest tests/ -q
